<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagixo OCR Results</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- KaTeX CSS from CDN (JS is now bundled via npm) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" crossorigin="anonymous" />

  <!-- marked.js and KaTeX JS are bundled via npm — no CDN scripts needed -->

  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow-x:hidden; }
    @keyframes slideInRight { from{transform:translateX(40px);opacity:0} to{transform:translateX(0);opacity:1} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .animate-slide-in { animation: slideInRight 0.3s ease-out; }
    .animate-fade { animation: fadeIn 0.2s ease-out; }
    /* Markdown rendered content styles */
    .md-body h1,.md-body h2,.md-body h3{font-weight:600;margin:12px 0 6px;color:#c7d2fe}
    .md-body h1{font-size:1.3em} .md-body h2{font-size:1.15em} .md-body h3{font-size:1.05em}
    .md-body p{margin:6px 0;line-height:1.7} .md-body ul,.md-body ol{padding-left:20px;margin:6px 0}
    .md-body li{margin:3px 0} .md-body code{background:rgba(255,255,255,0.06);padding:2px 5px;border-radius:4px;font-size:0.9em;font-family:'JetBrains Mono',monospace}
    .md-body pre{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0}
    .md-body pre code{background:none;padding:0} .md-body table{border-collapse:collapse;width:100%;margin:8px 0}
    .md-body th,.md-body td{border:1px solid rgba(255,255,255,0.1);padding:6px 10px;text-align:left;font-size:0.9em}
    .md-body th{background:rgba(255,255,255,0.04);font-weight:600}
    .md-body blockquote{border-left:3px solid rgba(99,102,241,0.4);padding-left:12px;margin:8px 0;color:rgba(165,180,252,0.7)}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
