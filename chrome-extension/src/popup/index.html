<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagixo OCR</title>

  <!-- Google Fonts — Inter for clean UI typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- KaTeX CDN (not bundled — too large for extension) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css"
    crossorigin="anonymous"
  />

  <style>
    /* Popup fixed dimensions — Chrome enforces these */
    html, body {
      width: 320px;
      min-height: 480px;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Shimmer animation for progress bars and hover effects */
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
